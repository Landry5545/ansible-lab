version: "3.8"

# Capstone services: Wiki.js, Snipe-IT, Uptime Kuma
# Deployed on server-vm (10.10.10.10), behind existing Nginx reverse proxy.
# Secrets are pulled from a local .env file (not committed) — see .env.example.

networks:
  capstone-net:
    external: false

volumes:
  wikijs-db-data:
  snipeit-db-data:
  snipeit-app-data:
  uptime-kuma-data:

services:

  # ---------- Wiki.js ----------
  wikijs-db:
    image: postgres:15-alpine
    container_name: wikijs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikijs
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASSWORD}
    volumes:
      - wikijs-db-data:/var/lib/postgresql/data
    networks:
      - capstone-net

  wikijs:
    image: requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    depends_on:
      - wikijs-db
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${WIKIJS_DB_PASSWORD}
      DB_NAME: wikijs
    ports:
      - "3001:3000"   # proxied via Nginx as wiki.lab.local
    networks:
      - capstone-net

  # ---------- Snipe-IT ----------
  snipeit-db:
    image: mariadb:10.11
    container_name: snipeit-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snipeit
      MYSQL_USER: snipeit
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SNIPEIT_DB_ROOT_PASSWORD}
    volumes:
      - snipeit-db-data:/var/lib/mysql
    networks:
      - capstone-net

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit
    restart: unless-stopped
    depends_on:
      - snipeit-db
    environment:
      APP_URL: http://assets.lab.local:8081
      APP_KEY: ${SNIPEIT_APP_KEY}   # generate with: docker run --rm snipe/snipe-it php artisan key:generate --show
      DB_CONNECTION: mysql
      DB_HOST: snipeit-db
      DB_DATABASE: snipeit
      DB_USERNAME: snipeit
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD}
    volumes:
      - snipeit-app-data:/var/lib/snipeit
    ports:
      - "3002:80"   # proxied via Nginx as assets.lab.local
    networks:
      - capstone-net

  # ---------- Uptime Kuma ----------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    dns:
      - 10.10.10.10
      - 8.8.8.8
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3003:3001"   # proxied via Nginx as status.lab.local
    networks:
      - capstone-net
